name: deploy after test

on: 
  workflow_run: 
    workflows: [ 'Run Test' ]
    types: completed

jobs:
  deploy_after_test:
    runs-on: ubuntu-latest
    steps:
      - name: check the status of Run Test
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: echo "test passed successfully"

      - name: the status of Run Test when not passed 
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: echo "the Run Test failed or cancelled" 
  
    
