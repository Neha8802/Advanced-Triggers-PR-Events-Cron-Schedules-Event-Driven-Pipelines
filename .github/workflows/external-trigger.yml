name: repository-dispatch workflow

on: 
  repository_dispatch:
    types:
      - deploy-request

jobs:
  repository-request:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: actions/checkout@v4

      - name: Process External Client Payload
        run: |
          echo "🚀 Received external dispatch event!"
          echo "Target Environment: ${{ github.event.client_payload.environment }}"
